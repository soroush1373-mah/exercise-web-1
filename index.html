<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table and inputs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <style>
      .table-dark th {
        color: #cdc8e5;
        padding: 20px;
      }
      .btn {
        background-color: aliceblue;
      }
    </style>
  </head>
  <body>
    <div class="w-75 container p-5">
      <h1 class="text-body">table information</h1>
      <table class="mt-3 table table-dark table-striped table-bordered">
        <thead class="border-success">
          <tr class="text-center">
            <th>number</th>
            <th>first name</th>
            <th>last name</th>
            <th>nick name</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="infotable" class="text-center"></tbody>

        <tr>
          <td>number</td>
          <td><input id="input1" type="text" /></td>
          <td><input id="input2" type="text" /></td>
          <td>
            <input id="input3" type="text" />
          </td>
          <td>
            <button onclick="add()" class="btn btn-outline-primary">add</button>
          </td>
        </tr>
      </table>
    </div>
  </body>
  <script>
    const firstName = document.getElementById("input1");
    const lastName = document.getElementById("input2");
    const nickName = document.getElementById("input3");
    const datatable = document.getElementById("infotable");

    function add() {
      if ((firstName.value, lastName.value, nickName.value === "")) {
        alert("you should fill the inputs");
      } else {
        datatable.innerHTML += ` 
        <tr>
            <td>${datatable.rows.length + 1}</td>
            <td>${firstName.value}</td>
            <td>${lastName.value}</td>
            <td>${nickName.value}</td>
            <td></td>

        </tr>`;
        firstName.value = "";
        lastName.value = "";
        nickName.value = "";
      }
    }
  </script>
</html>
