<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to do list</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
  </head>
  <style>
    .text-center {
      display: flex;
      flex-direction: column;
      margin: 20%;
    }
    img {
      width: 10%;
      border-radius: 30%;
    }
    .container {
      margin-top: 5%;
    }
  </style>
  <body>
    <div class="text-center bg-secondary-subtle w-50 p-3 rounded-5">
      <h1 class="text-success">
        wrtie two texts
        <img src="/images/cheaklist.jpg" alt="chekphoto" />
      </h1>
      <label for="input">text1</label>
      <input type="text" class="btn btn-light" id="input1" />
      <label for="input">text2</label>
      <input type="text" class="btn btn-light" id="input2" />
      <button onclick="add()" class="btn btn-success w-25 container mb-3">
        add
      </button>
      <ul type="text" class="form-control p-3" id="inputtext1"></ul>
      <ul type="text" class="form-control p-3" id="inputtext2"></ul>
    </div>

    <script>
      const text1 = document.getElementById("input1");
      const text2 = document.getElementById("input2");
      const form1 = document.getElementById("inputtext1");
      const form2 = document.getElementById("inputtext2");

      function add() {
        if ((text1.value, text2.value === "")) {
          alert("you should fill two text");
        } else {
          form1.textContent = text1.value;
          form2.textContent = text2.value;
          text1.value = "";
          text2.value = "";
        }
      }
    </script>
  </body>
</html>
