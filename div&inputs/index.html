<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>list content</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
  </head>
  <style>
    img {
      border-radius: 30%;
      width: 25%;
    }
  </style>
  <body>
    <div class="container mt-5 w-50 bg-dark-subtle text-center rounded-4">
      <h1 class="text-success">
        write text
        <img class="m-4 p-4" src="/images/cheaklist.jpg" alt="checklist" />
      </h1>
      <div class="pb-5">
        <input
          class="w-50 p-2 rounded-2"
          id="input-text"
          type="text"
          placeholder="write your text"
        />
        <button onclick="add()" class="btn btn-outline-dark p-sm-2">add</button>
        <ul class="form-check">
          <li id="newtext" class="form-check bg-light rounded-4 m-3 p-3"></li>
        </ul>
      </div>
    </div>
    <script>
      const text = document.getElementById("input-text");
      const form = document.getElementById("newtext");

      function add() {
        if (text.value === "") {
          alert("you must write something");
        } else {
          form.textContent = text.value;
          text.value = "";
        }
      }
    </script>
  </body>
</html>
